name: Open green dev promotion
on:
  workflow_run:
    workflows: [Iskra CI, Release delivery]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  promote:
    name: Check, open or merge the dev promotion
    if: >-
      github.repository == 'Energy-Quant/Iskra' && github.ref == 'refs/heads/main' &&
      vars.ISKRA_RELEASE_APP_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.name == 'Iskra CI' && github.event.workflow_run.head_branch == 'dev' &&
          contains(fromJSON('["push","workflow_dispatch","pull_request"]'), github.event.workflow_run.event)) ||
         (github.event.workflow_run.name == 'Release delivery' && github.event.workflow_run.head_branch == 'main' &&
          contains(fromJSON('["workflow_dispatch","schedule"]'), github.event.workflow_run.event)))))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    concurrency:
      group: promote-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.ISKRA_RELEASE_APP_ID }}
          private-key: ${{ secrets.ISKRA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Iskra
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-checks: read
          permission-workflows: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RESUME_PROMOTION: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'Release delivery') && '1' || '0' }}
        run: python3 scripts/promote.py
