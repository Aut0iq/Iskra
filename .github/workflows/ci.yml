name: Iskra CI
on:
  push:
    branches: [main, dev, 'feature-**', 'bugfix-**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/branch-policy.py
      - if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: echo "::warning::Owner push to dev. Prefer feature-/bugfix- PRs for reviewable changes."
  linux:
    uses: ./.github/workflows/linux.yml
  portable:
    name: Portable (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: windows-2025, platform: windows}
          - {os: macos-15, platform: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: Pillow==13.0.0
      - run: python -m unittest discover -s scripts/tests -p test_portable.py
      - name: Build portable plugin staging and avatar toolkit
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/build-plugin.py --wait 0 --output dist/staging
          version="$(python -c 'import json; print(json.load(open("plugin/iskra/zeron-plugin.json"))["version"])')"
          python scripts/package-portable.py --source "dist/staging/iskra-$version" --output "dist/packages/iskra-plugin-UNSIGNED-$PLATFORM.zip"
          python scripts/prepare-toolkit.py dist/toolkit
          python scripts/package-portable.py --source dist/toolkit --output "dist/packages/iskra-avatar-tools-$PLATFORM.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: iskra-portable-${{ matrix.platform }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: CI Gate
    if: always()
    needs: [policy, linux, portable]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failures:
              raise SystemExit(str(failures))
          print('Every required job succeeded; no skipped/cancelled check is accepted.')
          PYTHON
  promote:
    name: Promote dev through CI
    needs: gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        if: vars.ISKRA_RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.ISKRA_RELEASE_APP_ID }}
          private-key: ${{ secrets.ISKRA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Iskra
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - name: Merge the green dev PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$HEAD_SHA"
          gh workflow run ci.yml --ref main
