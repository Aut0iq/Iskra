name: Iskra CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/branch-policy.py
      - if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.actor == 'Energy-Quant'
        run: echo "::warning::Owner push to dev. Prefer feature-/bugfix- PRs for reviewable changes."
  linux:
    uses: ./.github/workflows/linux.yml
  portable:
    name: Portable (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: windows-2025, platform: windows}
          - {os: macos-15, platform: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: Pillow==13.0.0
      - run: python -m unittest discover -s scripts/tests -p test_portable.py
      - name: Build portable plugin staging and avatar toolkit
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/build-plugin.py --wait 0 --output dist/staging
          version="$(python -c 'import json; print(json.load(open("plugin/iskra/zeron-plugin.json", encoding="utf-8"))["version"])')"
          python scripts/package-portable.py --source "dist/staging/iskra-$version" --output "dist/packages/iskra-plugin-UNSIGNED-$PLATFORM.zip"
          python scripts/prepare-toolkit.py dist/toolkit
          python scripts/package-portable.py --source dist/toolkit --output "dist/packages/iskra-avatar-tools-$PLATFORM.zip"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: iskra-portable-${{ matrix.platform }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
  contents:
    name: Artifact contract
    needs: [linux, portable]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist/contracts
      - run: python3 scripts/check-artifacts.py dist/contracts
  gate:
    name: CI Gate
    if: always()
    needs: [policy, linux, portable, contents]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failures:
              raise SystemExit(str(failures))
          print('Every required job succeeded; no skipped/cancelled check is accepted.')
          PYTHON
  promote:
    name: Promote dev through CI
    needs: gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        if: vars.ISKRA_RELEASE_APP_ID != ''
        with:
          app-id: ${{ vars.ISKRA_RELEASE_APP_ID }}
          private-key: ${{ secrets.ISKRA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Iskra
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-checks: read
          permission-workflows: write
      - name: Merge the green dev PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP_ID: ${{ vars.ISKRA_RELEASE_APP_ID }}
        run: |
          pending="$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[]|select(.draft and (.tag_name|startswith("v")))]|length')"
          if [ "$pending" != 0 ]; then
            echo 'Stable draft pending: promotion is held until publication.'
            exit 0
          fi
          # The dev push and PR have separate gates; either may finish first.
          gh pr checks "$PR_NUMBER" --required --watch --fail-fast --interval 10
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/merge" --method PUT \
            -f merge_method=merge -f sha="$HEAD_SHA" \
            --jq 'if .merged then .sha else error(.message) end'
          if [ -n "$APP_ID" ]; then
            gh api "repos/$GH_REPO/merges" --method POST -f base=dev -f head=main -f commit_message='Sync promoted main into dev'
          else
            # App merges trigger push CI; GITHUB_TOKEN merges need dispatch.
            gh workflow run ci.yml --ref main
          fi
