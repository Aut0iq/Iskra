# Build on Windows without MSVC or a mingw toolchain: the gnullvm target
# links through rustc's bundled lld with self-contained CRT objects, and
# crt-static folds libunwind + the mingw CRT into the exe (no runtime DLLs).
[target.x86_64-pc-windows-gnullvm]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
